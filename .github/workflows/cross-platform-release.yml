name: Windows and Linux release assets
on:
  pull_request:
    paths:
      - .github/workflows/cross-platform-release.yml
      - CMakeLists.txt
      - CMakePresets.json
      - Cargo.toml
      - Cargo.lock
      - cmake/**
      - crates/**
      - desktop/**
      - scripts/ci/**
      - scripts/release/**
      - tests/**
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag (vX.Y.Z)
        required: true
        type: string
      publish:
        description: Attach unsigned Windows ZIP and Linux AppImage to the existing GitHub Release
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cross-platform-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Windows x64 package
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      RUSTC_WRAPPER: ''
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install pinned build tools
        run: python -m pip install -r scripts/ci/requirements.txt
      - name: Install Qt and QScintilla
        run: python scripts/ci/desktop.py dependencies
      - name: Build and test native app
        run: |
          python scripts/ci/desktop.py build
          python scripts/ci/desktop.py test
      - name: Prepare Qt source notices
        run: python scripts/release/prepare_qt_notices.py --output build/ci/qt-notices
      - name: Build Release without developer tools
        shell: pwsh
        run: |
          $qt = (Resolve-Path build/ci/qt/6.8.3/msvc2022_64).Path
          $qsci = (Resolve-Path build/ci/qscintilla).Path
          cmake --preset release "-DCMAKE_PREFIX_PATH=$qt;$qsci" "-DCMAKE_CXX_COMPILER_LAUNCHER="
          cmake --build --preset release --parallel 2
      - name: Package and smoke test Windows ZIP
        run: >-
          python scripts/release/cross_platform.py windows
          --build build/release
          --qt build/ci/qt/6.8.3/msvc2022_64
          --qscintilla build/ci/qscintilla
          --qt-notices build/ci/qt-notices
          --output build/cross-platform/windows
      - name: Preserve unsigned Windows candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-unsigned-${{ inputs.tag || github.sha }}
          path: build/cross-platform/windows/*.zip
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux x86_64 AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install native and pinned build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libdbus-1-dev libssl-dev libcairo2 libfuse2t64 libxcb-cursor0 libxkbcommon-x11-0
          python -m pip install -r scripts/ci/requirements.txt -r scripts/release/requirements.txt
      - name: Install Qt and QScintilla
        run: python scripts/ci/desktop.py dependencies
      - name: Build and test native app
        run: |
          python scripts/ci/desktop.py build
          python scripts/ci/desktop.py test
      - name: Prepare Qt source notices
        run: python scripts/release/prepare_qt_notices.py --output build/ci/qt-notices
      - name: Build Release without developer tools
        run: |
          qt="$PWD/build/ci/qt/6.8.3/gcc_64"
          qsci="$PWD/build/ci/qscintilla"
          cmake --preset release "-DCMAKE_PREFIX_PATH=$qt;$qsci"
          cmake --build --preset release --parallel 2
      - name: Package and smoke test Linux AppImage
        run: >-
          python scripts/release/cross_platform.py linux
          --build build/release
          --qt build/ci/qt/6.8.3/gcc_64
          --qscintilla build/ci/qscintilla
          --qt-notices build/ci/qt-notices
          --output build/cross-platform/linux
      - name: Preserve Linux candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ inputs.tag || github.sha }}
          path: |
            build/cross-platform/linux/*.AppImage
            build/cross-platform/linux/*.sha256
            build/cross-platform/linux/*-inventory.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attach verified assets to GitHub Release
    if: inputs.publish
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: windows-unsigned-${{ inputs.tag }}
          path: build/cross-platform/windows
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: linux-${{ inputs.tag }}
          path: build/cross-platform/linux
      - name: Verify release state and asset bytes
        run: |
          version="${{ inputs.tag }}"
          version="${version#v}"
          python scripts/release/attach_platforms.py --tag "${{ inputs.tag }}" \
            --windows "build/cross-platform/windows/ChoscorDB-${version}-windows-x64.zip" \
            --linux "build/cross-platform/linux/ChoscorDB-${version}-linux-x86_64.AppImage" \
            --dry-run
      - name: Attach and verify public downloads
        run: |
          version="${{ inputs.tag }}"
          version="${version#v}"
          python scripts/release/attach_platforms.py --tag "${{ inputs.tag }}" \
            --windows "build/cross-platform/windows/ChoscorDB-${version}-windows-x64.zip" \
            --linux "build/cross-platform/linux/ChoscorDB-${version}-linux-x86_64.AppImage"
