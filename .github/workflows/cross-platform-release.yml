name: Windows and Linux release assets
on:
  pull_request:
    paths:
      - .github/workflows/cross-platform-release.yml
      - CMakeLists.txt
      - CMakePresets.json
      - Cargo.toml
      - Cargo.lock
      - cmake/**
      - crates/**
      - desktop/**
      - scripts/ci/**
      - scripts/release/**
      - tests/**
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable candidate tag (vX.Y.Z)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: cross-platform-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Windows x64 package
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      RUSTC_WRAPPER: ''
      QT_QPA_PLATFORM: offscreen
      QT_QPA_FONTDIR: C:/Windows/Fonts
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false
      - name: Assert exact candidate tag
        if: inputs.tag
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Stable vX.Y.Z tag required' }
          $head = (git rev-parse HEAD).Trim()
          $tagCommit = (git rev-parse "refs/tags/$tag^{commit}").Trim()
          if ($head -ne $tagCommit) { throw 'Checkout is not the selected exact tag' }
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Verify production Pages feed
        if: inputs.tag
        run: python scripts/release/update_feeds.py verify-site --repo "${{ github.repository }}"
      - name: Install pinned build tools
        shell: pwsh
        run: |
          python -m pip install -r scripts/ci/requirements.txt
          choco install nsis --version=3.11.0 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Rehearse installer rollback and startup readiness
        run: python -m unittest scripts/release/test_windows_installer_integration.py
      - name: Install Qt and QScintilla
        run: python scripts/ci/desktop.py dependencies
      - name: Build and test native app
        run: |
          python scripts/ci/desktop.py build
          python scripts/ci/desktop.py test
      - name: Capture Windows workspace test output after a native failure
        if: failure()
        run: python scripts/ci/qt_test_output.py build/ci/native/choscordb-workspace-tests.exe
      - name: Prepare Qt source notices
        run: python scripts/release/prepare_qt_notices.py --output build/ci/qt-notices
      - name: Build Release without developer tools
        shell: pwsh
        run: |
          $qt = (Resolve-Path build/ci/qt/6.8.3/msvc2022_64).Path
          $qsci = (Resolve-Path build/ci/qscintilla).Path
          $updates = "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/updates"
          $updateOptions = @()
          if ($env:RELEASE_TAG -ne '') {
            $updateOptions = @(
              '-DCHOSCORDB_CROSS_PLATFORM_UPDATER=ON',
              '-DCHOSCORDB_UPDATE_PUBLIC_KEY=tWwf5+4hAmilViw6CrynbGYUr5ISGt/4OOAKR5jm+0o=',
              "-DCHOSCORDB_UPDATE_BASE_URL=$updates",
              '-DCHOSCORDB_UPDATE_REPOSITORY=${{ github.repository }}'
            )
          }
          cmake --preset release "-DCMAKE_PREFIX_PATH=$qt;$qsci" "-DCMAKE_CXX_COMPILER_LAUNCHER=" @updateOptions
          cmake --build --preset release --parallel 2
      - name: Package and smoke test Windows per-user installer
        run: >-
          python scripts/release/cross_platform.py windows
          --build build/release
          --qt build/ci/qt/6.8.3/msvc2022_64
          --qscintilla build/ci/qscintilla
          --qt-notices build/ci/qt-notices
          --output build/cross-platform/windows
      - name: Preserve unsigned Windows candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-unsigned-${{ inputs.tag || github.sha }}
          path: |
            build/cross-platform/windows/*-setup.exe
            build/cross-platform/windows/*.sha256
            build/cross-platform/windows/*.candidate.json
            build/cross-platform/windows/*-inventory.json
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux x86_64 AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      QT_QPA_PLATFORM: offscreen
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false
      - name: Assert exact candidate tag
        if: inputs.tag
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Verify production Pages feed
        if: inputs.tag
        run: python scripts/release/update_feeds.py verify-site --repo "${{ github.repository }}"
      - name: Install native and pinned build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libdbus-1-dev libssl-dev libgl-dev libegl-dev \
            libcairo2 libfuse2t64 \
            libfontconfig1-dev libfreetype-dev libx11-dev libx11-xcb-dev \
            libxcb-cursor-dev libxcb-glx0-dev libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render-util0-dev \
            libxcb-shape0-dev libxcb-shm0-dev libxcb-sync-dev libxcb-util-dev \
            libxcb-xfixes0-dev libxcb-xkb-dev libxcb1-dev libxext-dev \
            libxfixes-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev libxrender-dev
          python -m pip install -r scripts/ci/requirements.txt -r scripts/release/requirements.txt
      - name: Install Qt and QScintilla
        run: python scripts/ci/desktop.py dependencies
      - name: Build and test native app
        run: |
          python scripts/ci/desktop.py build
          python scripts/ci/desktop.py test
      - name: Prepare Qt source notices
        run: python scripts/release/prepare_qt_notices.py --output build/ci/qt-notices
      - name: Build Release without developer tools
        run: |
          qt="$PWD/build/ci/qt/6.8.3/gcc_64"
          qsci="$PWD/build/ci/qscintilla"
          update_options=()
          if [[ -n "$RELEASE_TAG" ]]; then
            update_options=(
              -DCHOSCORDB_CROSS_PLATFORM_UPDATER=ON
              '-DCHOSCORDB_UPDATE_PUBLIC_KEY=tWwf5+4hAmilViw6CrynbGYUr5ISGt/4OOAKR5jm+0o='
              '-DCHOSCORDB_UPDATE_BASE_URL=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/updates'
              '-DCHOSCORDB_UPDATE_REPOSITORY=${{ github.repository }}'
            )
          fi
          cmake --preset release "-DCMAKE_PREFIX_PATH=$qt;$qsci" "${update_options[@]}"
          cmake --build --preset release --parallel 2
      - name: Package and smoke test Linux AppImage
        run: >-
          python scripts/release/cross_platform.py linux
          --build build/release
          --qt build/ci/qt/6.8.3/gcc_64
          --qscintilla build/ci/qscintilla
          --qt-notices build/ci/qt-notices
          --output build/cross-platform/linux
      - name: Preserve Linux candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ inputs.tag || github.sha }}
          path: |
            build/cross-platform/linux/*.AppImage
            build/cross-platform/linux/*.sha256
            build/cross-platform/linux/*.candidate.json
            build/cross-platform/linux/*-inventory.json
          if-no-files-found: error
          retention-days: 14
