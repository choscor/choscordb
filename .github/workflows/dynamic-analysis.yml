name: Dynamic analysis
on:
  schedule:
    - cron: '17 4 * * 0'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dynamic-analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sanitizers:
    name: Native ASan and UBSan (LLVM 23)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      CHOSCORDB_SANITIZERS: address,undefined
      CMAKE_PREFIX_PATH: ${{ github.workspace }}/build/ci/qt/6.8.3/gcc_64:${{ github.workspace }}/build/ci/qscintilla
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install native and LLVM 23 sanitizer tools
        run: |
          python -m pip install --requirement scripts/ci/requirements.txt
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libdbus-1-dev libssl-dev libgl1-mesa-dev libegl1-mesa-dev libfontconfig1-dev libfreetype6-dev libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxi-dev libxrender-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1
          curl --fail --show-error --silent https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor --yes --output /usr/share/keyrings/apt.llvm.org.gpg
          echo 'deb [signed-by=/usr/share/keyrings/apt.llvm.org.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-23 main' | sudo tee /etc/apt/sources.list.d/llvm23.list
          sudo apt-get update
          sudo apt-get install --yes clang-23 llvm-23
      - name: Build and test first-party native C++ with ASan and UBSan
        run: |
          python scripts/ci/quality.py native-dependencies
          cmake --preset sanitizers
          cmake --build --preset sanitizers
          ctest --test-dir build/sanitizers --output-on-failure --timeout 120
      - name: Preserve sanitizer logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sanitizer-logs
          path: build/sanitizers/Testing/Temporary
          if-no-files-found: ignore
          retention-days: 14
  stress:
    name: Timing-sensitive Qt stress detection
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CMAKE_PREFIX_PATH: ${{ github.workspace }}/build/ci/qt/6.8.3/gcc_64:${{ github.workspace }}/build/ci/qscintilla
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install native dependencies
        run: |
          python -m pip install --requirement scripts/ci/requirements.txt
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libdbus-1-dev libssl-dev libgl1-mesa-dev libegl1-mesa-dev libfontconfig1-dev libfreetype6-dev libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxi-dev libxrender-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1
      - name: Build strict native tests
        run: |
          python scripts/ci/quality.py native-dependencies
          cmake --preset strict
          cmake --build --preset strict
      - name: Repeat timing-sensitive tests and stop on the first failure
        run: ctest --test-dir build/strict --output-on-failure --timeout 120 --repeat until-fail:20 --tests-regex '(workspace|disconnect|history)'
      - name: Preserve stress logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stress-logs
          path: build/strict/Testing/Temporary
          if-no-files-found: ignore
          retention-days: 14
