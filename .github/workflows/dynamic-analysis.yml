name: Dynamic analysis
on:
  schedule:
    - cron: '17 4 * * 0'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dynamic-analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sanitizers:
    name: Native ASan and UBSan (LLVM 23)
    runs-on: macos-15
    timeout-minutes: 75
    env:
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      CHOSCORDB_SANITIZERS: address,undefined
      CMAKE_PREFIX_PATH: ${{ github.workspace }}/build/ci/qt/6.8.3/macos:${{ github.workspace }}/build/ci/qscintilla
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install LLVM 23 sanitizer tools
        run: |
          python -m pip install --requirement scripts/ci/requirements.txt
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - name: Build and test first-party native C++ with ASan and UBSan
        run: |
          python scripts/ci/quality.py native-dependencies
          cmake --preset sanitizers
          cmake --build --preset sanitizers
          ctest --test-dir build/sanitizers --output-on-failure --timeout 120
      - name: Preserve sanitizer logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sanitizer-logs
          path: build/sanitizers/Testing/Temporary
          if-no-files-found: ignore
          retention-days: 14
  stress:
    name: Timing-sensitive Qt stress detection
    runs-on: macos-15
    timeout-minutes: 75
    env:
      CMAKE_PREFIX_PATH: ${{ github.workspace }}/build/ci/qt/6.8.3/macos:${{ github.workspace }}/build/ci/qscintilla
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install native dependencies
        run: |
          python -m pip install --requirement scripts/ci/requirements.txt
      - name: Build strict native tests
        run: |
          python scripts/ci/quality.py native-dependencies
          cmake --preset strict
          cmake --build --preset strict
      - name: Repeat timing-sensitive tests and stop on the first failure
        run: ctest --test-dir build/strict --output-on-failure --timeout 120 --repeat until-fail:20 --tests-regex '(workspace|disconnect|history)'
      - name: Preserve stress logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stress-logs
          path: build/strict/Testing/Temporary
          if-no-files-found: ignore
          retention-days: 14
