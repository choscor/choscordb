name: CI
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Deterministic quality
    runs-on: macos-15
    timeout-minutes: 30
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24'
      - name: Install pinned quality tools
        run: |
          python -m pip install --requirement scripts/ci/requirements.txt
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          cargo install cargo-deny --version 0.20.2 --locked
          brew install clang-format openssl@3
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: Run fast repository quality gates
        run: python scripts/ci/quality.py fast
      - name: Check that owning docs follow code changes
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: python scripts/ci/docs_policy.py --changed --base "origin/$BASE_REF"
  platform:
    name: Rust and native (macos-15)
    runs-on: macos-15
    timeout-minutes: 75
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -D warnings
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install pinned Python build tools
        run: python -m pip install --requirement scripts/ci/requirements.txt
      - name: Check all Rust targets and features
        run: python scripts/ci/quality.py rust-check
      - name: Run strict Clippy on all targets and features
        run: python scripts/ci/quality.py rust-clippy
      - name: Test all Rust features
        run: python scripts/ci/quality.py rust-tests
      - name: Install Qt and verified QScintilla sources
        run: python scripts/ci/quality.py native-dependencies
      - name: Strict native build
        run: python scripts/ci/quality.py native-build
      - name: Run all native tests offscreen
        run: python scripts/ci/quality.py native-tests
  native-static-analysis:
    name: Native static analysis (LLVM 23)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      CMAKE_PREFIX_PATH: ${{ github.workspace }}/build/ci/qt/6.8.3/macos:${{ github.workspace }}/build/ci/qscintilla
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install LLVM 23 and IWYU tools
        run: |
          python -m pip install --requirement scripts/ci/requirements.txt
          brew install llvm include-what-you-use
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - name: Install Qt and verified QScintilla sources
        run: python scripts/ci/quality.py native-dependencies
      - name: Configure LLVM analysis
        run: cmake --preset clang-tidy
      - name: Baseline strict clang-tidy profile
        # Baseline-only until the first LLVM 23 result is reviewed and green.
        continue-on-error: true
        run: cmake --build --preset clang-tidy --target choscordb-clang-tidy
      - name: Compile self-contained public headers
        run: cmake --build --preset clang-tidy --target choscordb-header-check
      - name: Run advisory Include-What-You-Use
        continue-on-error: true
        run: |
          cmake --preset iwyu
          cmake --build --preset iwyu --target choscordb-iwyu
  postgres-integration:
    name: PostgreSQL 17 integration (sequential)
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      max-parallel: 1
    env:
      CARGO_INCREMENTAL: '0'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Install PostgreSQL 17 and native dependencies
        run: |
          brew install postgresql@17 openssl@3
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
          python -m pip install --requirement scripts/ci/requirements.txt
      - name: Build native integration tests
        run: |
          python scripts/ci/quality.py native-dependencies
          python scripts/ci/quality.py native-build
      - name: Start owned PostgreSQL fixture
        run: |
          python scripts/integration/postgres_fixture.py start --bin-dir "$(brew --prefix postgresql@17)/bin"
          python scripts/integration/postgres_fixture.py env | jq --raw-output 'to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_ENV"
      - name: Run ignored driver integration suites sequentially
        run: cargo test -p choscordb-driver-postgres --locked -- --include-ignored --test-threads=1
      - name: Run ignored core integration suite sequentially
        run: cargo test -p choscordb-core --test postgres_disconnect --locked -- --include-ignored --test-threads=1
      - name: Run native PostgreSQL coverage sequentially
        run: python scripts/ci/quality.py native-tests
      - name: Preserve PostgreSQL failure logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: postgres-17-logs
          path: build/integration/postgres/server.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop owned PostgreSQL fixture
        if: always()
        run: python scripts/integration/postgres_fixture.py stop
  mysql-integration:
    name: MySQL 8.4 integration
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Start local MySQL 8.4 fixture
        run: |
          brew install mysql@8.4
          python scripts/integration/mysql_ci_fixture.py start --bin-dir "$(brew --prefix mysql@8.4)/bin"
      - name: Run MySQL driver integration tests
        run: cargo test -p choscordb-driver-mysql --lib --test live --test editing --test driver_contract --locked -- --include-ignored --test-threads=1
      - name: Run MySQL core integration tests
        run: cargo test -p choscordb-core --test mysql --locked -- --include-ignored --test-threads=1
      - name: Preserve MySQL failure logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mysql-8.4-logs
          path: build/integration/mysql/server.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop local MySQL fixture
        if: always()
        run: python scripts/integration/mysql_ci_fixture.py stop

  mariadb-integration:
    name: MariaDB 11.4 integration
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CHOSCORDB_MARIADB_PORT: "33307"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Start local MariaDB 11.4 fixture
        run: |
          brew install mariadb@11.4
          python scripts/integration/mysql_ci_fixture.py start --flavor mariadb --bin-dir "$(brew --prefix mariadb@11.4)/bin"
      - name: Run MariaDB driver integration tests
        run: cargo test -p choscordb-driver-mysql --lib --test live --test editing --test driver_contract --test mariadb --locked -- --include-ignored --test-threads=1
      - name: Run MariaDB core integration tests
        run: cargo test -p choscordb-core --test mysql --test mariadb --locked -- --include-ignored --test-threads=1
      - name: Preserve MariaDB failure logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mariadb-11.4-logs
          path: build/integration/mariadb/server.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop local MariaDB fixture
        if: always()
        run: python scripts/integration/mysql_ci_fixture.py stop --flavor mariadb
