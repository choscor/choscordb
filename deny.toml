# Mechanical Cargo dependency license policy, not a distribution/legal approval.
# Qt and QScintilla are audited separately: see docs/CI.md.
[licenses]
allow = ["Apache-2.0", "GPL-3.0-or-later", "MIT", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.95

# Reviewed BSD-3-Clause text in subtle 2.6.1, used by Secret Service cryptography.
# See docs/CI.md; notices must be included in release artifacts.
[[licenses.exceptions]]
name = "subtle"
version = "=2.6.1"
allow = ["BSD-3-Clause"]
