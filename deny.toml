[advisories]
yanked = "deny"
unmaintained = "workspace"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
skip = []
skip-tree = []

[licenses]
allow = ["Apache-2.0", "GPL-3.0-or-later", "MIT", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.95

[[licenses.exceptions]]
name = "subtle"
version = "=2.6.1"
allow = ["BSD-3-Clause"]

[[licenses.exceptions]]
name = "ed25519-dalek"
version = "=2.2.0"
allow = ["BSD-3-Clause"]

[[licenses.exceptions]]
name = "curve25519-dalek"
version = "=4.1.3"
allow = ["BSD-3-Clause"]

[[licenses.exceptions]]
name = "winx"
version = "=0.36.4"
allow = ["Apache-2.0 WITH LLVM-exception"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
