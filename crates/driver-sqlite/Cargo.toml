[package]
name = "choscordb-driver-sqlite"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
[lints]
workspace = true
[dependencies]
choscordb-driver-api = { path = "../driver-api" }
async-trait = "0.1"
rusqlite = { version = "0.37", features = ["bundled", "column_decltype", "hooks"] }
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
tempfile = "3"
serde_json = "1"
