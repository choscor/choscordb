[package]
name = "choscordb-driver-api"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lints]
workspace = true

[dependencies]
hmac = "0.12"
percent-encoding = "2"
sha2 = "0.10"
shlex = "2"
fs2 = "0.4"
tempfile = "3"
whoami = "2"
serde_json = "1"
zeroize = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["process", "signal"] }
