[package]
name = "choscordb-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
fs2 = "0.4"
choscordb-credentials = { path = "../credentials" }
choscordb-diagnostics = { path = "../diagnostics" }
uuid = { version = "1", features = ["v4"] }
choscordb-storage = { path = "../storage" }
async-trait = "0.1"
choscordb-export = { path = "../export" }
choscordb-result-cache = { path = "../result-cache" }
choscordb-result-store = { path = "../result-store" }
choscordb-driver-api = { path = "../driver-api" }
choscordb-sql-language = { path = "../sql-language" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "fs", "io-util"] }
thiserror = "2"
rusqlite = { version = "0.41", features = ["bundled", "collation", "hooks", "limits"] }
serde_json = { version = "1", features = ["preserve_order"] }
csv = "1"
serde = "1"
tempfile = "3"
cap-std = { version = "4.0.3", default-features = false }
cap-fs-ext = { version = "4.0.3", default-features = false, features = ["std"] }
hayro = "0.9"

[dev-dependencies]
choscordb-driver-mysql = { path = "../driver-mysql" }
choscordb-driver-postgres = { path = "../driver-postgres" }
choscordb-driver-sqlite = { path = "../driver-sqlite" }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["process", "signal"] }
rustix = { version = "1", features = ["fs"] }
