[workspace]
members = ["crates/*"]
exclude = ["crates/driver-postgres/third_party/tokio-postgres"]
resolver = "3"

[patch.crates-io]
tokio-postgres = { path = "crates/driver-postgres/third_party/tokio-postgres" }

[workspace.package]
version = "0.1.7"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.lints.rust]
unsafe_code = "deny"
warnings = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
# Keep file and line information without storing full type/variable debug data.
debug = "line-tables-only"

[profile.dev.package."*"]
# Third-party debug data dominates the static bridge and test binaries.
debug = 0

[profile.debugging]
inherits = "dev"
debug = "full"

[profile.debugging.package."*"]
debug = "full"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
